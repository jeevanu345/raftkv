[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "warn"
# Maintenance-only exceptions, not vulnerability exceptions. See docs/SECURITY.md.
ignore = [
    "RUSTSEC-2025-0141", # bincode 1 format is used by persisted logs/checkpoints
    "RUSTSEC-2025-0057", # fxhash is an indirect sled dependency
    "RUSTSEC-2024-0384", # instant is an indirect sled dependency
    "RUSTSEC-2025-0134", # rustls-pemfile remains an indirect tonic dependency
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "warn"
unknown-git = "warn"

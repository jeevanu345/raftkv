<svg xmlns="http://www.w3.org/2000/svg" width="320" height="300" viewBox="0 0 320 300" role="img" aria-labelledby="title desc">
  <title id="title">RaftKV</title><desc id="desc">Three connected database nodes with a central leader. RaftKV distributed key-value store.</desc>
  <style>
    :root { --word:#eef1f5; --caption:#9ba5b1; --top:#52779d; --left:#223d58; --right:#152a3e; }
    .word{fill:var(--word)} .caption{fill:var(--caption)}
  </style>
  <defs><g id="node">
    <path d="M-43 0 0-22 43 0 0 22Z" fill="var(--top)" stroke="#79a5cd" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M-43 0 0 22V65L-43 43Z" fill="var(--left)"/>
    <path d="M0 22 43 0V43L0 65Z" fill="var(--right)"/>
    <path d="M-43 23 0 45 43 23" fill="none" stroke="#080f18" stroke-width="3"/>
    <path d="M-32 20-10 31M-32 35-10 46" stroke="#36c3ff" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="28" cy="23" rx="3" ry="4" fill="#36c3ff"/><ellipse cx="28" cy="39" rx="3" ry="4" fill="#36c3ff"/>
  </g></defs>
  <g fill="none" stroke="#28b6f2" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 90Q70 96 70 131M200 90Q250 96 250 131M160 119V164M113 164H207"/>
  </g>
  <use href="#node" x="160" y="64"/><use href="#node" x="70" y="140"/><use href="#node" x="250" y="140"/>
  <text x="160" y="260" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="800" font-size="62" letter-spacing="-2"><tspan class="word">Raft</tspan><tspan fill="#209aef">KV</tspan></text>
  <text class="caption" x="160" y="287" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-weight="600" font-size="11" letter-spacing="2">DISTRIBUTED KEY-VALUE STORE</text>
</svg>

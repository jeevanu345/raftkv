groups:
  - name: raftkv-availability
    interval: 30s
    rules:
      - alert: RaftKvNoLeader
        expr: max(raftkv_role{role="leader"}) == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "raftkv cluster has no leader"
          runbook: "Check node connectivity, election timeouts, and recent term bumps."

      - alert: RaftKvFlappingLeader
        expr: rate(raftkv_election_started_total[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Excessive leader elections (>0.5/s sustained)"
          runbook: "Investigate network or CPU pressure; consider increasing heartbeat / election timers."

      - alert: RaftKvCommitStalled
        expr: increase(raftkv_commit_index[2m]) == 0 and on() max(raftkv_role{role="leader"}) == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Commit index has not advanced in 2 minutes despite a leader being present"

      - alert: RaftKvHighAppendLatencyP99
        expr: histogram_quantile(0.99, rate(raftkv_append_latency_ms_bucket[5m])) > 50
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Append latency p99 above 50ms (sustained)"

# Example rules for ONE RaftKV consensus group per Prometheus scrape scope.
# Add a cluster/job selector before combining multiple independent groups.
groups:
  - name: raftkv-availability
    interval: 15s
    rules:
      - alert: RaftKvNoReportedLeader
        expr: sum(raftkv_is_leader) == 0 or absent(raftkv_is_leader)
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "No RaftKV process reports leadership, or telemetry is missing"
          description: "Check scrape health, peer connectivity and election logs. A reported leader alone does not prove a fresh quorum."

      - alert: RaftKvStorageFailed
        expr: raftkv_storage_healthy == 0
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "RaftKV node {{ $labels.node_id }} has stopped after a storage failure"
          description: "The runtime refuses dependent acknowledgments and client operations. Inspect the node API health error and disk before restarting."

      - alert: RaftKvFrequentElections
        expr: rate(raftkv_elections_started_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Frequent elections on RaftKV node {{ $labels.node_id }}"
          description: "Investigate network, disk or runtime pressure and timer configuration. This counts pre-vote rounds as well as elections."

      - alert: RaftKvCommitBacklogStalled
        expr: (raftkv_last_log_index - raftkv_commit_index > 0) and (changes(raftkv_commit_index[2m]) == 0) and (raftkv_is_leader == 1)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Leader {{ $labels.node_id }} has uncommitted entries without commit progress"
          description: "Check majority availability and replication. Idle clusters without backlog do not trigger this rule."

      - alert: RaftKvApplicationBacklog
        expr: raftkv_commit_index - raftkv_applied_index > 128
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Application backlog on RaftKV node {{ $labels.node_id }}"
          description: "Inspect storage health and application errors; the threshold is an example to tune for the workload."

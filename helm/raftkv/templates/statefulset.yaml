apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "raftkv.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "raftkv.name" . }}
spec:
  serviceName: {{ include "raftkv.fullname" . }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "raftkv.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "raftkv.name" . }}
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: raftkv-server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/raftkv/config.toml
          ports:
            - name: raft
              containerPort: {{ .Values.service.raftPort }}
            - name: client
              containerPort: {{ .Values.service.clientPort }}
            - name: metrics
              containerPort: {{ .Values.service.metricsPort }}
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/raftkv
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "raftkv.fullname" . }}-config
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}

[workspace]
resolver = "2"
members = [
    "crates/raft-core",
    "crates/raft-storage",
    "crates/raft-net",
    "crates/kv-state-machine",
    "crates/resp-server",
    "crates/raftkv-server",
    "crates/raftkv-cli",
    "crates/linearizability-checker",
    "crates/sim-tests",
]
exclude = ["fuzz", "nemesis"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["raftkv contributors"]
license = "Apache-2.0"
repository = "https://github.com/example/raftkv"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
prost = "0.13"
prost-types = "0.13"
bytes = "1.7"

# Networking / gRPC
tonic = { version = "0.12", features = ["tls"] }
tonic-build = "0.12"

# Storage
sled = "0.34"
# rocksdb is heavy; gated as optional in the state machine crate

# Errors
thiserror = "1"
anyhow = "1"

# Logging / metrics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.27"
opentelemetry = "0.26"
opentelemetry_sdk = { version = "0.26", features = ["rt-tokio"] }
opentelemetry-otlp = "0.26"
prometheus = "0.13"

# Utility
smallvec = { version = "1.13", features = ["serde", "union"] }
crc32c = "0.6"
rand = "0.8"
rand_chacha = "0.3"
parking_lot = "0.12"
dashmap = "6"
once_cell = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
hex = "0.4"
glob = "0.3"
sha2 = "0.10"

# Testing
proptest = "1.5"
quickcheck = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = 1
panic = "unwind"

[profile.bench]
lto = "thin"
codegen-units = 1
opt-level = 3
debug = 1

[profile.dev]
opt-level = 0
debug = 2

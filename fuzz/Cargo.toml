[package]
name="raftkv-fuzz"
version="0.0.0"
publish=false
edition="2021"
[package.metadata]
cargo-fuzz=true
[dependencies]
libfuzzer-sys="0.4"
raft-core={path="../crates/raft-core"}
raft-net={path="../crates/raft-net"}
raft-storage={path="../crates/raft-storage"}
kv-state-machine={path="../crates/kv-state-machine"}
resp-server={path="../crates/resp-server"}
sim-tests={path="../crates/sim-tests"}
bytes="1"
bincode="1.3"
prost="0.13"
tokio-util={version="0.7",features=["codec"]}
tempfile="3"
[workspace]

[[bin]]
name="resp_decoder"
path="fuzz_targets/resp_decoder.rs"
test=false
doc=false
bench=false

[[bin]]
name="command_parser"
path="fuzz_targets/command_parser.rs"
test=false
doc=false
bench=false

[[bin]]
name="raft_conversion"
path="fuzz_targets/raft_conversion.rs"
test=false
doc=false
bench=false

[[bin]]
name="log_recovery"
path="fuzz_targets/log_recovery.rs"
test=false
doc=false
bench=false

[[bin]]
name="snapshot_decoder"
path="fuzz_targets/snapshot_decoder.rs"
test=false
doc=false
bench=false

[[bin]]
name="bincode_command"
path="fuzz_targets/bincode_command.rs"
test=false
doc=false
bench=false

[[bin]]
name="raft_sequences"
path="fuzz_targets/raft_sequences.rs"
test=false
doc=false
bench=false
